{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: triton-nvaie-metrics
  labels:
    app.kubernetes.io/name: triton-nvaie
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: triton-nvaie
  endpoints:
    - port: metrics
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
